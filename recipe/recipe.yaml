context:
  name: pyiceberg-core
  python_name: pyiceberg_core
  version: "0.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ python_name }}-${{ version }}.tar.gz
  sha256: ce52bd4ba0a69011b0a110275cf2711790c9c420e2dd0aa188adbec4c3a8e724

build:
  number: 0
  python:
    version_independent: true
requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
        - maturin >=1.0,<2
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - python ${{ python_min }}.*
    - python-abi3
    - maturin >=1.2.2,<2
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - pyiceberg_core
      python_version:
        - "${{ python_min }}.*"
        - "*"
  - requirements:
      run:
        - pip
        - abi3audit
    script:
      - pip check
      # Ask the interpreter where the extension module actually landed instead of
      # hard-coding site-packages / file suffix per platform.
      - python -c "import importlib.util, subprocess, sys; so = importlib.util.find_spec('pyiceberg_core.pyiceberg_core_rust').origin; print('auditing', so); sys.exit(subprocess.call([sys.executable, '-m', 'abi3audit', so, '-s', '-v', '--assume-minimum-abi3', '${{ python_min }}']))"

about:
  homepage: https://github.com/apache/iceberg-rust/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
    - bindings/python/THIRDPARTY.yml
  summary: |
    This project is used to build an iceberg-rust powered core for pyiceberg, and intended for use only by pyiceberg.
  repository: https://github.com/apache/iceberg-rust/

extra:
  recipe-maintainers:
    - sumanth-manchala
